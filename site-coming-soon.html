<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DvirTech — האתר בקרוב</title>
<script>
  (function(){
    var saved = "he";
    try { saved = localStorage.getItem("dvirtech_lang") || "he"; } catch(e) {}
    document.documentElement.lang = saved;
    document.documentElement.dir = saved === "he" ? "rtl" : "ltr";
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-950:#121A2C; --navy-900:#182238; --navy-800:#232F49;
    --teal:#4FD9C7; --blue:#2563EB;
    --grad:linear-gradient(100deg, var(--blue) 0%, var(--teal) 100%);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:linear-gradient(160deg,#0F1626 0%, var(--navy-950) 55%, var(--navy-800) 100%);
    color:#EDF1F7;font-family:'Heebo',sans-serif;line-height:1.65;
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    position:relative;overflow:hidden;
  }
  .glow{position:absolute;border-radius:50%;filter:blur(60px);opacity:.22;pointer-events:none}
  .glow1{background:var(--blue);width:420px;height:420px;top:-140px;right:-120px}
  .glow2{background:var(--teal);width:380px;height:380px;bottom:-160px;left:-100px}

  .card{position:relative;z-index:1;max-width:560px;width:100%;text-align:center}
  .logo{height:52px;width:auto;border-radius:8px;margin:0 auto 30px;display:block}
  .badge{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
    color:#8FD9CB;font-size:12.5px;font-weight:600;letter-spacing:.3px;padding:7px 16px;border-radius:20px;margin-bottom:22px}
  .badge .dot{width:7px;height:7px;border-radius:50%;background:var(--teal);box-shadow:0 0 8px var(--teal);animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}

  h1{font-family:'Rubik',sans-serif;font-weight:800;font-size:clamp(28px,4.5vw,42px);margin:0 0 16px;color:#F5F7FA}
  h1 .g{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  p{color:#B9C4D6;font-size:16px;max-width:460px;margin:0 auto 32px}

  .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:36px}
  .btn{display:inline-flex;align-items:center;gap:8px;border:none;cursor:pointer;font-family:'Heebo',sans-serif;font-weight:700;
    font-size:14.5px;border-radius:12px;padding:13px 24px;text-decoration:none;transition:transform .15s, box-shadow .15s}
  .btn:hover{transform:translateY(-2px)}
  .btn-primary{background:var(--grad);color:#fff;box-shadow:0 8px 24px rgba(37,99,235,.28)}
  .btn-ghost{background:rgba(255,255,255,.06);color:#EDF1F7;border:1px solid rgba(255,255,255,.14)}

  .lang-switch{display:inline-flex;gap:2px;background:rgba(255,255,255,.06);border-radius:20px;padding:3px;margin-bottom:26px}
  .lang-btn{border:none;background:none;color:#9CA9BE;font-size:12px;font-weight:600;padding:6px 14px;border-radius:16px;cursor:pointer;transition:.15s;font-family:'Heebo',sans-serif}
  .lang-btn.active{background:var(--grad);color:#fff}

  footer{position:relative;z-index:1;margin-top:8px;font-size:12.5px;color:#7C8AA0}
</style>
</head>
<body>

<div class="glow glow1"></div>
<div class="glow glow2"></div>

<div class="card">
  <div class="lang-switch">
    <button class="lang-btn" data-lang="he" onclick="setLang('he')">עברית</button>
    <button class="lang-btn" data-lang="en" onclick="setLang('en')">English</button>
  </div>

  <img class="logo" src="images/logo-dvirtech.png" alt="DvirTech">

  <div class="badge"><span class="dot"></span><span id="badgeText"></span></div>

  <h1><span id="titleMain"></span> <span class="g" id="titleHighlight"></span></h1>
  <p id="bodyText"></p>

  <div class="actions">
    <a class="btn btn-primary" id="waBtn" href="#" target="_blank" rel="noopener"></a>
    <a class="btn btn-ghost" id="mailBtn" href="mailto:info@dvirtech.co.il"></a>
  </div>
</div>

<footer id="footerText"></footer>

<script>
  const COPY = {
    he: {
      badge:"בפיתוח פעיל", main:"האתר החדש שלנו", highlight:"בדרך אליכם",
      body:"אנחנו בונים גרסה חדשה ומקצועית לאתר DvirTech — הרכבת מחשבים בהתאמה אישית, תמיכה טכנית ושירות לקוחות, הכול במקום אחד. השקה בקרוב.",
      wa:"דברו איתנו בוואטסאפ", mail:"שלחו לנו מייל",
      footer:"© DvirTech — שירותי מחשוב ותמיכה טכנית"
    },
    en: {
      badge:"In active development", main:"Our new website", highlight:"is on its way",
      body:"We're building a new, professional version of the DvirTech site — custom PC builds, technical support, and customer service, all in one place. Launching soon.",
      wa:"Chat with us on WhatsApp", mail:"Send us an email",
      footer:"© DvirTech — Computer Services & Technical Support"
    }
  };
  let LANG = "he";
  try { LANG = localStorage.getItem("dvirtech_lang") || "he"; } catch(e) {}

  function render(){
    const c = COPY[LANG];
    document.getElementById("badgeText").textContent = c.badge;
    document.getElementById("titleMain").textContent = c.main;
    document.getElementById("titleHighlight").textContent = c.highlight;
    document.getElementById("bodyText").textContent = c.body;
    document.getElementById("waBtn").textContent = c.wa;
    document.getElementById("waBtn").href = "https://wa.me/972500000000?text=" + encodeURIComponent(LANG === "he" ? "היי דביר, ראיתי שהאתר בדרך :)" : "Hi Dvir, saw the new site is coming soon :)");
    document.getElementById("mailBtn").textContent = c.mail;
    document.getElementById("footerText").textContent = c.footer;
    document.querySelectorAll(".lang-btn").forEach(b => b.classList.toggle("active", b.dataset.lang === LANG));
    document.documentElement.lang = LANG;
    document.documentElement.dir = LANG === "he" ? "rtl" : "ltr";
  }
  function setLang(l){ LANG = l; try { localStorage.setItem("dvirtech_lang", l); } catch(e) {} render(); }
  render();
</script>
</body>
</html>
