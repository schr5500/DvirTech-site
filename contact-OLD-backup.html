<!-- ======================= צור קשר ======================= -->
<section class="contact-hero">
  <div class="wrap">
    <h1 id="pageTitle"></h1>
    <p id="pageSubtitle"></p>
  </div>
</section>

<div class="wrap contact-wrap">

  <!-- שלוש דרכי הפנייה, כרטיס לכל אחת -->
  <div class="contact-grid">
    <div class="ccard ccard--wa">
      <div class="ccard-ic"><svg class="ui-ic" aria-hidden="true"><use href="#ui-chat"/></svg></div>
      <b id="waTitle"></b>
      <span id="waDesc"></span>
      <a class="btn btn-accent" id="whatsappBtn" href="#" target="_blank" rel="noopener"></a>
    </div>

    <div class="ccard">
      <div class="ccard-ic"><svg class="ui-ic" aria-hidden="true"><use href="#ui-headset"/></svg></div>
      <b id="phoneLabel"></b>
      <a class="ccard-val" href="tel:0502000373" dir="ltr">050-200-0373</a>
      <div class="ccard-acts">
        <a class="btn btn-secondary" id="callBtn" href="tel:0502000373"></a>
        <button class="ccard-copy" type="button" data-copy="050-200-0373"></button>
      </div>
    </div>

    <div class="ccard">
      <div class="ccard-ic"><svg class="ui-ic" aria-hidden="true"><use href="#ui-shield"/></svg></div>
      <b id="emailLabel"></b>
      <a class="ccard-val" href="mailto:schr5500@gmail.com" dir="ltr">schr5500@gmail.com</a>
      <div class="ccard-acts">
        <!-- ⚠️ mailto: לא עושה כלום כשאין תוכנת דואר מוגדרת בווינדוס —
             וזה המצב אצל רוב משתמשי Gmail. לכן הכפתור הראשי פותח את
             Gmail בדפדפן, ולידו כפתור העתקה שתמיד עובד. -->
        <a class="btn btn-secondary" id="emailBtn" target="_blank" rel="noopener"
           href="https://mail.google.com/mail/?view=cm&fs=1&to=schr5500@gmail.com"></a>
        <button class="ccard-copy" type="button" data-copy="schr5500@gmail.com"></button>
      </div>
    </div>
  </div>

  <!-- פרטים מרוכזים -->
  <div class="contact-info">
    <div class="cinfo">
      <b id="hoursLabel"></b>
      <p id="hoursText"></p>
    </div>
    <div class="cinfo">
      <b id="areaLabel"></b>
      <p id="areaText"></p>
    </div>
    <div class="cinfo">
      <b id="respLabel"></b>
      <p id="respText"></p>
    </div>
  </div>

  <div class="contact-cancel">
    <b id="cancelTitle"></b>
    <p id="cancelText"></p>
    <a class="btn btn-secondary" id="cancelBtn" href="#" target="_blank" rel="noopener"></a>
  </div>
</div>
