<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DvirTech — בקרוב</title>
<script>
  (function(){
    var saved = "he";
    try { saved = localStorage.getItem("dvirtech_lang") || "he"; } catch(e) {}
    document.documentElement.lang = saved;
    document.documentElement.dir = saved === "he" ? "rtl" : "ltr";
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="wrap headbar">
    <div class="brand"><img class="brand-logo" src="images/logo-dvirtech.png" alt="DvirTech"></div>
    <div class="lang-switch">
      <button class="lang-btn" data-lang="he" onclick="setLang('he')">עברית</button>
      <button class="lang-btn" data-lang="en" onclick="setLang('en')">English</button>
    </div>
  </div>
</header>

<div class="cs-wrap" style="min-height:calc(100vh - 84px)">
  <h1 id="csTitle"></h1>
  <p id="csText"></p>
  <div class="cs-actions">
    <button class="btn btn-accent" style="width:auto" onclick="contactWhatsapp()" id="csContactBtn"></button>
  </div>
</div>

<footer>
  <img class="footer-logo" src="images/logo-dvirtech.png" alt="DvirTech">
  <span id="footerText"></span>
</footer>

<script src="i18n.js"></script>
<script>
  const WHATSAPP_NUMBER = "972546125857";

  function render(){
    document.getElementById("csTitle").textContent = t("siteComingSoonTitle");
    document.getElementById("csText").textContent = t("siteComingSoonText");
    document.getElementById("csContactBtn").textContent = t("contactWhatsappBtn");
    document.getElementById("footerText").textContent = t("footerText");
    document.querySelectorAll(".lang-btn").forEach(b => b.classList.toggle("active", b.dataset.lang === LANG));
  }

  function setLang(lang){
    if(lang === LANG) return;
    setLangCore(lang);
    render();
  }

  function contactWhatsapp(){
    const msg = tr("היי דביר, ראיתי את האתר ורציתי לשמוע פרטים נוספים", "Hi Dvir, I saw the website and wanted to hear more details");
    window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`, "_blank");
  }

  render();
</script>
</body>
</html>
