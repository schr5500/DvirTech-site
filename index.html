<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DvirTech</title>
<script>
  // מונע הבהוב שפה: קובע dir/lang לפני שהעמוד מצטייר, לפי מה שנשמר בעבר
  (function(){
    var saved = "he";
    try { saved = localStorage.getItem("dvirtech_lang") || "he"; } catch(e) {}
    document.documentElement.lang = saved;
    document.documentElement.dir = saved === "he" ? "rtl" : "ltr";
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="wrap headbar">
    <div class="brand"><img class="brand-logo" src="images/logo-dvirtech.png" alt="DvirTech"></div>
    <div class="lang-switch">
      <button class="lang-btn" data-lang="he" onclick="setLang('he')">עברית</button>
      <button class="lang-btn" data-lang="en" onclick="setLang('en')">English</button>
    </div>
  </div>
</header>

<div class="service-screen" id="serviceScreen" style="display:flex">
  <h1 class="service-heading" id="serviceHeading"></h1>
  <p class="service-sub" id="serviceSub"></p>

  <div class="service-grid">
    <div class="service-card" onclick="goToService('builder')">
      <div class="service-icon-wrap"><svg class="service-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="6" y="6" width="12" height="12" rx="1.5"/><rect x="9" y="9" width="6" height="6"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/></svg></div>
      <h3 id="titleBuilder"></h3>
      <p id="descBuilder"></p>
      <span class="service-arrow"></span>
    </div>
    <div class="service-card" onclick="goToService('catalog')">
      <div class="service-icon-wrap"><svg class="service-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg></div>
      <h3 id="titleCatalog"></h3>
      <p id="descCatalog"></p>
      <span class="service-arrow"></span>
    </div>
    <div class="service-card" onclick="goToService('support')">
      <div class="service-icon-wrap"><svg class="service-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg></div>
      <h3 id="titleSupport"></h3>
      <p id="descSupport"></p>
      <span class="service-arrow"></span>
    </div>
    <div class="service-card" onclick="goToService('contact')">
      <div class="service-icon-wrap"><svg class="service-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></div>
      <h3 id="titleContact"></h3>
      <p id="descContact"></p>
      <span class="service-arrow"></span>
    </div>
  </div>
</div>

<footer>
  <img class="footer-logo" src="images/logo-dvirtech.png" alt="DvirTech">
  <span id="footerText"></span>
  <div class="footer-legal">
    <a href="about.html" id="footerAboutLink"></a>
    <a href="contact.html" id="footerContactLink"></a>
    <a href="terms.html" id="footerTermsLink"></a>
  </div>
</footer>

<script src="i18n.js"></script>
<script src="landing.js"></script>
<script src="cart.js"></script>
</body>
</html>
