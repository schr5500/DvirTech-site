     data-he="הרכבה, מערכת הפעלה, תיקונים וביקורי בית — עם המחיר כתוב מראש. בוחרים את השירות, עונים על כמה שאלות קצרות, והפנייה מגיעה אליי מסודרת בוואטסאפ."

  <!-- ⚠️ המחירים כאן הם המחירון של דביר (PRICE_LIST ב-2-pricelist-picker.gs).

       ⚠️ **אסור לכתוב "כולל מע״מ".** DvirTech הוא עוסק פטור: הוא אינו
       גובה מע״מ ואינו רשאי להציג מחיר כ"כולל מע״מ" — זו הצגה לא נכונה
       כלפי הלקוח וגם חריגה ממעמד העוסק. הניסוח הנכון הוא "זה מה
       שתשלם", בלי להזכיר מע״מ בכלל. (המע״מ ב-11-catalog.gs הוא דבר
       אחר לגמרי: מה ש**דביר** משלם לספק, לא מה שהלקוח משלם לו.) -->
  <p class="sup-lede-note"
     data-he="המחירים הם מחיר השירות עצמו — זה מה שתשלם, בלי תוספות. חלקים או רישיונות שנרכשים בנפרד אינם כלולים, ואם מתברר שהעבודה שונה ממה שתיארת — נעדכן ביחד לפני שמתחילים."
     data-en="Prices are for the service itself — that is what you pay, with nothing added. Parts or licenses bought separately are not included, and if the job turns out different from what you described, we'll agree on it together before starting."></p>
