<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DvirTech</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="cs-wrap">
  <img class="brand-logo" src="images/logo-dvirtech-transparent.png" alt="DvirTech" style="margin-bottom:20px">
  <h1 id="csTitle"></h1>
  <p id="csText"></p>
  <div class="cs-actions">
    <button class="btn btn-primary" style="width:auto" onclick="window.location.href='builder.html'" id="csBuilderBtn"></button>
    <button class="btn" style="width:auto;background:#EEF1F5;color:var(--ink)" onclick="window.location.href='home.html'" id="csBackBtn"></button>
  </div>
</div>

<script src="sprite.js"></script>
<script src="i18n.js"></script>
<script>
  (function(){
    try { LANG = localStorage.getItem("dvirtech_lang") || "he"; } catch(e) {}
    document.documentElement.lang = LANG;
    document.documentElement.dir = LANG === "he" ? "rtl" : "ltr";
    document.getElementById("csTitle").textContent = t("comingSoonTitle");
    document.getElementById("csText").textContent = t("comingSoonText");
    document.getElementById("csBuilderBtn").textContent = t("goToBuilder");
    document.getElementById("csBackBtn").textContent = t("backToServices");
  })();
</script>
<footer></footer>
<script src="site-footer.js"></script>
</body>
</html>
