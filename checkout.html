<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DvirTech — סיכום הזמנה</title>
<script>
  (function(){
    var saved = "he";
    try { saved = localStorage.getItem("dvirtech_lang") || "he"; } catch(e) {}
    document.documentElement.lang = saved;
    document.documentElement.dir = saved === "he" ? "rtl" : "ltr";
  })();
</script>
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
/* =====================================================================
   סגנונות מקומיים לדף התשלום בלבד.
   ⚠️ **בכוונה כאן ולא ב-style.css** — style.css הוא קובץ משותף לכל
   האתר ונערך במקביל ע"י מי שעובד על העיצוב הכללי; שינוי שלו מכאן היה
   דורס עבודה של אחרים. כל מה שכאן נוגע אך ורק לרכיבים של checkout.html.

   ⚠️ הסלקטורים מתחילים ב-#servicesBox (id) כדי לגבור על הכללים
   הכלליים ב-style.css בלי !important — id שווה יותר מ-class בסדר
   העדיפויות של CSS, וזה בדיוק מה שצריך כאן.
   ===================================================================== */

/* --- 1. להבליט שאזור השירותים הוא תפריט נפתח ---
   הבעיה שתוקנה: <details> נראה כמו כותרת סטטית. לקוח שלא הבין שאפשר
   ללחוץ פשוט לא ראה את השירותים בכלל. שלוש הבהרות ביחד: רקע תכלת
   בולט מהרקע הלבן, מילת פעולה מפורשת ("הצג"/"הסתר"), וחץ בתוך עיגול
   שמסתובב בפתיחה. גם מסגרת מודגשת ב-hover וגם focus-visible למקלדת. */
#servicesBox{
  border:1.5px solid #C7DDFC;
  background:var(--blue-soft,#E9F2FE);
  overflow:hidden;
  transition:border-color .15s, box-shadow .15s;
}
#servicesBox:hover{border-color:var(--blue,#1B6FE0)}
#servicesBox[open]{background:var(--surface,#fff);border-color:var(--blue,#1B6FE0)}
#servicesBox > .svc-summary{
  padding:13px;
  font-size:13.5px;
  transition:background .15s;
}
#servicesBox > .svc-summary:hover{background:rgba(27,111,224,.07)}
#servicesBox > .svc-summary:focus-visible{
  outline:2px solid var(--blue,#1B6FE0);
  outline-offset:-2px;
}
#servicesBox .svc-title{font-weight:800}
/* מילת הפעולה — הדבר שהופך "כותרת" ל"כפתור" בעיניים של הלקוח */
#servicesBox .svc-toggle{
  display:inline-flex;align-items:center;gap:5px;
  font-size:12px;font-weight:700;color:var(--blue,#1B6FE0);
  white-space:nowrap;
}
#servicesBox .svc-toggle-close{display:none}
#servicesBox[open] .svc-toggle-open{display:none}
#servicesBox[open] .svc-toggle-close{display:inline}
#servicesBox .svc-chev{
  width:20px;height:20px;flex:none;
  display:inline-grid;place-items:center;
  border-radius:50%;
  background:#fff;
  border:1px solid #C7DDFC;
  color:var(--blue,#1B6FE0);
  transition:transform .18s ease, background .15s;
}
#servicesBox > .svc-summary:hover .svc-chev{background:var(--blue,#1B6FE0);color:#fff;border-color:var(--blue,#1B6FE0)}
#servicesBox[open] .svc-chev{transform:rotate(180deg)}
/* המונה נדחף שמאלה, אבל מילת הפעולה חייבת להישאר צמודה לחץ */
#servicesBox .svc-count{margin-inline-start:auto}

/* --- 2. שירות שכלול בחבילה שנבחרה ---
   מסומן, נעול, ומחירו 0. מוצג ולא מוסתר, כדי שהלקוח יראה **מה** הוא
   מקבל בתוך ה-700 ₪ ולא רק שהוא לא יכול ללחוץ. */
#servicesBox .svc-opt.is-covered{
  border-color:#B7EFE5;
  background:#F0FDFA;
  cursor:default;
}
#servicesBox .svc-opt.is-covered:hover{border-color:#B7EFE5}
#servicesBox .svc-opt.is-covered input{accent-color:var(--teal-dark,#0F766E)}
#servicesBox .svc-opt.is-covered .svc-price{color:var(--teal-dark,#0F766E)}
#servicesBox .svc-opt.is-covered .svc-name{color:var(--ink,#0F2540)}

/* --- 3. הודעה כשהשירותים נעולים כי אין מחשב שלם בעגלה --- */
#servicesBox .svc-hint.is-locked{
  background:#FFF7E6;
  border:1px solid #FFE0A3;
  border-radius:9px;
  color:#7A5200;
  padding:9px 11px;
  margin:0 13px 9px;
  font-weight:600;
}
</style>
</head>
<body>

<header>
  <div class="wrap headbar">
    <a class="brand" href="home.html" aria-label="DvirTech — לדף הבית"><img class="brand-logo" src="images/logo-dvirtech-transparent.png" alt="DvirTech"></a>
    <div class="lang-switch">
      <button class="lang-btn" data-lang="he" onclick="setLang('he')">עברית</button>
      <button class="lang-btn" data-lang="en" onclick="setLang('en')">English</button>
    </div>
  </div>
</header>

<div class="wrap" style="max-width:640px;padding-top:36px;padding-bottom:60px">
  <a href="javascript:history.back()" class="checkout-back-link" id="backLink"></a>

  <div class="panel" style="margin-top:14px">
    <h1 id="pageTitle" style="font-size:22px;margin:0 0 4px"></h1>
    <p class="sub" id="pageSubtitle" style="margin:0 0 20px"></p>

    <div id="emptyState" style="display:none;text-align:center;padding:30px 0">
      <p id="emptyStateText" style="color:var(--ink-soft);margin-bottom:16px"></p>
      <a href="catalog.html" class="btn btn-primary" id="emptyStateBtn" style="display:inline-flex;width:auto;padding:12px 22px"></a>
    </div>

    <div id="checkoutContent">
      <ul class="summary-list" id="checkoutSummary"></ul>

      <!-- מוצג רק כשהעגלה מכילה רכיבים שמרכיבים מחשב שלם אבל הם נקנו
           בנפרד ולא דרך הבונה. checkout.js מחליט (ראה assemblyNotice). -->
      <div class="assembly-notice" id="assemblyNotice" hidden></div>
      <div class="checkout-total-row">
        <span id="checkoutTotalLabel"></span>
        <span id="checkoutTotalPrice">0 ₪</span>
      </div>

      <!-- ⚠️ מחיר המשלוח המהיר מוגדר בשרת (SHIPPING_OPTIONS_ ב-
           4-payment-api.gs) ומוצג כאן מתוך DVT_SHIPPING ב-checkout.js.
           שני המקומות חייבים להישאר תואמים — הלקוח רואה את מה שכתוב
           כאן, אבל **נגבה** מה שהשרת מחשב. -->
      <div style="margin:18px 0 12px">
        <label class="field-label" style="margin-bottom:6px;display:block" id="shippingLabel"></label>
        <div id="shippingOptions" class="ship-opts"></div>
      </div>

      <!-- שירותים נוספים. ⚠️ <details> מקופל, בכוונה: זו תוספת
           אופציונלית ולא שלב בהזמנה, ורשימה פתוחה של שבעה שירותים מעל
           כפתור התשלום נקראת כמו מכשול/upsell אגרסיבי. המונה בכותרת
           מראה מה נבחר גם כשהאזור סגור. המחירים מגיעים מ-DVT_SERVICES
           ב-checkout.js (תצוגה) ונגבים לפי SERVICE_OPTIONS_ ב-
           4-payment-api.gs — ומקור האמת לשניהם הוא PRICE_LIST ב-
           CRM+SUPPLIERS/2-pricelist-picker.gs. -->
      <details class="svc-box" id="servicesBox" style="margin:18px 0 12px">
        <!-- ⚠️ ה-summary כולל **מילת פעולה** ("הצג"/"הסתר") ולא רק חץ:
             חץ לבד לא נקרא כאפשרות לחיצה אצל חלק מהלקוחות, וזו הייתה
             תקלה אמיתית — האזור נראה ככותרת סטטית ואף אחד לא פתח אותו.
             שני ה-span מוחלפים ע"י CSS לפי [open], כדי שהטקסט יישאר
             נכון בלי JS ובלי לשבור את מתג השפה. -->
        <summary class="svc-summary">
          <span class="svc-title" id="servicesTitle"></span>
          <span class="svc-count" id="servicesCount"></span>
          <span class="svc-toggle">
            <span class="svc-toggle-open" id="servicesToggleOpen"></span>
            <span class="svc-toggle-close" id="servicesToggleClose"></span>
            <svg class="svc-chev" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 9.5l6 6 6-6" fill="none" stroke="currentColor"
                    stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
        </summary>
        <p class="svc-hint" id="servicesHint"></p>
        <div id="servicesOptions" class="svc-opts"></div>
      <div id="servicesOnRequest" class="svc-onreq"></div>
      </details>

      <!-- 🎁 אזור המתנה. נבנה כולו ב-renderGiftBlock() ב-checkout.js
           ונשאר display:none עד שהעגלה באמת עוברת רף.
           ⚠️ יושב **אחרי** השירותים ולפני התשלומים בכוונה: זה הרגע
           שבו הלקוח כבר יודע מה הוא קונה וטרם החליט איך לשלם, וזו
           הנקודה שבה "מגיעה לך מתנה" משנה החלטה ולא סתם מקשט.
           ⚠️ **תצוגה בלבד.** הזכאות והתקרה נקבעות בשרת
           (giftsEarned_/giftResolvePick_); כאן רק נשלח מק"ט. -->
      <div id="giftBlock" class="gift-block" style="display:none"></div>

      <div style="margin:18px 0 12px">
        <label class="field-label" style="margin-bottom:6px;display:block" id="installmentsLabel"></label>
        <select id="installmentsCount" onchange="renderCheckoutTotals()">
          <option value="1">1</option><option value="2">2</option><option value="3">3</option>
          <option value="4">4</option><option value="6">6</option><option value="8">8</option>
          <option value="10">10</option><option value="12">12</option>
        </select>
        <p style="font-size:11.5px;color:var(--ink-soft);margin:6px 0 0" id="installmentsHint"></p>
      </div>

      <ul class="summary-list" id="shipRow" style="display:none;margin-bottom:8px">
        <li><span class="k" id="shipLabel"></span><span class="v" id="shipValue">0 ₪</span></li>
      </ul>
      <ul class="summary-list" id="servicesRow" style="display:none;margin-bottom:8px">
        <li><span class="k" id="servicesRowLabel"></span><span class="v" id="servicesRowValue">0 ₪</span></li>
      </ul>
      <ul class="summary-list" id="feeRow" style="display:none;margin-bottom:8px">
        <li><span class="k" id="feeLabel"></span><span class="v" id="feeValue">0 ₪</span></li>
      </ul>
      <div class="checkout-total-row">
        <span id="grandTotalLabel"></span>
        <span id="grandTotalPrice">0 ₪</span>
      </div>
      <p id="monthlyBreakdownRow" style="display:none;font-size:12.5px;color:var(--ink-soft);margin:8px 0 0;text-align:center"></p>

      <div class="checkout-field">
        <label class="field-label" id="labelName"></label>
        <input id="custName" type="text" autocomplete="name">
      </div>
      <div class="checkout-field">
        <label class="field-label" id="labelPhone"></label>
        <input id="custPhone" type="tel" autocomplete="tel" dir="ltr">
      </div>
      <div class="checkout-field">
        <label class="field-label" id="labelEmail"></label>
        <input id="custEmail" type="email" autocomplete="email" dir="ltr">
      </div>

      <!-- ⚠️ **כתובת למשלוח — בלעדיה אין לאן לשלוח.** עד 16.08.2026
           הטופס אסף שם/טלפון/מייל בלבד, כלומר הזמנה עם משלוח הגיעה
           בלי כתובת ודביר היה צריך לרדוף אחרי הלקוח בטלפון.
           ⚠️ מוצג **רק** כשנבחר משלוח (לא באיסוף עצמי) — ראה
           toggleAddressFields ב-checkout.js. שדה כתובת שמופיע למי
           שבא לאסוף בעצמו הוא בדיוק סוג החיכוך שגורם לנטישה.
           ⚠️ הכתובת נשלחת לשרת ונכנסת לקבלה; היא **לא** נשמרת בדפדפן. -->
      <div id="shipAddressBlock" style="display:none">
        <div class="checkout-field">
          <label class="field-label" id="labelCity"></label>
          <input id="custCity" type="text" autocomplete="address-level2">
        </div>
        <div class="checkout-field">
          <label class="field-label" id="labelStreet"></label>
          <input id="custStreet" type="text" autocomplete="street-address">
        </div>
        <div class="checkout-field">
          <label class="field-label" id="labelAptNotes"></label>
          <input id="custAptNotes" type="text" autocomplete="off">
        </div>
      </div>

      <label style="display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;margin:4px 0 12px;cursor:pointer">
        <input type="checkbox" id="isBusinessCheckbox" onchange="toggleBusinessField()" style="width:16px;height:16px;cursor:pointer">
        <span id="isBusinessLabel"></span>
      </label>
      <div class="checkout-field" id="companyNameField" style="display:none">
        <label class="field-label" id="labelCompanyName"></label>
        <input id="custCompanyName" type="text">
        <p id="invoiceTypeHint" style="font-size:11.5px;color:var(--ink-soft);margin:6px 0 0"></p>
      </div>

      <label style="display:flex;align-items:flex-start;gap:8px;font-size:13.5px;color:var(--ink-soft);margin-top:16px;cursor:pointer">
        <input type="checkbox" id="termsAgreeCheckbox" style="margin-top:3px;flex-shrink:0;width:16px;height:16px;cursor:pointer">
        <span id="termsAgreeLabel"></span>
      </label>

      <div id="checkoutValidation" class="validation-msg" style="display:none"></div>
      <button class="btn btn-accent" id="checkoutSubmitBtn" onclick="submitCheckout()"></button>
    </div>
  </div>
</div>

<footer></footer>

<script src="sprite.js"></script>
<script src="i18n.js"></script>
<script src="site-content.js"></script>
<script src="search-core.js"></script>
<!-- 🔴 חסר עד 19.08: site-header.js מזריק את תיבת החיפוש לכותרת של
     **כל** דף, אבל הקוד שמפעיל אותה נטען רק ב-4 דפים. בתשעת
     האחרים — ובכללם דף החנות ודף התשלום — הלקוח הקליד בתיבה
     ושום דבר לא קרה. אותו סוג תקלה כמו החיפוש בבונה. -->
<script src="site-search.js"></script>
<script src="site-header.js"></script>
<script src="site-footer.js"></script>
<script src="cart.js"></script>
<script src="checkout.js"></script>
</body>
</html>
