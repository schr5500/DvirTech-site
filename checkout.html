<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DvirTech — סיכום הזמנה</title>
<script>
  (function(){
    var saved = "he";
    try { saved = localStorage.getItem("dvirtech_lang") || "he"; } catch(e) {}
    document.documentElement.lang = saved;
    document.documentElement.dir = saved === "he" ? "rtl" : "ltr";
  })();
</script>
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="wrap headbar">
    <a class="brand" href="index.html" aria-label="DvirTech — לדף הבית"><img class="brand-logo" src="images/logo-dvirtech-transparent.png" alt="DvirTech"></a>
    <div class="lang-switch">
      <button class="lang-btn" data-lang="he" onclick="setLang('he')">עברית</button>
      <button class="lang-btn" data-lang="en" onclick="setLang('en')">English</button>
    </div>
  </div>
</header>

<div class="wrap" style="max-width:640px;padding-top:36px;padding-bottom:60px">
  <a href="javascript:history.back()" class="checkout-back-link" id="backLink"></a>

  <div class="panel" style="margin-top:14px">
    <h1 id="pageTitle" style="font-size:22px;margin:0 0 4px"></h1>
    <p class="sub" id="pageSubtitle" style="margin:0 0 20px"></p>

    <div id="emptyState" style="display:none;text-align:center;padding:30px 0">
      <p id="emptyStateText" style="color:var(--ink-soft);margin-bottom:16px"></p>
      <a href="catalog.html" class="btn btn-primary" id="emptyStateBtn" style="display:inline-flex;width:auto;padding:12px 22px"></a>
    </div>

    <div id="checkoutContent">
      <ul class="summary-list" id="checkoutSummary"></ul>

      <!-- מוצג רק כשהעגלה מכילה רכיבים שמרכיבים מחשב שלם אבל הם נקנו
           בנפרד ולא דרך הבונה. checkout.js מחליט (ראה assemblyNotice). -->
      <div class="assembly-notice" id="assemblyNotice" hidden></div>
      <div class="checkout-total-row">
        <span id="checkoutTotalLabel"></span>
        <span id="checkoutTotalPrice">0 ₪</span>
      </div>

      <!-- ⚠️ מחיר המשלוח המהיר מוגדר בשרת (SHIPPING_OPTIONS_ ב-
           4-payment-api.gs) ומוצג כאן מתוך DVT_SHIPPING ב-checkout.js.
           שני המקומות חייבים להישאר תואמים — הלקוח רואה את מה שכתוב
           כאן, אבל **נגבה** מה שהשרת מחשב. -->
      <div style="margin:18px 0 12px">
        <label class="field-label" style="margin-bottom:6px;display:block" id="shippingLabel"></label>
        <div id="shippingOptions" class="ship-opts"></div>
      </div>

      <!-- שירותים נוספים. ⚠️ <details> מקופל, בכוונה: זו תוספת
           אופציונלית ולא שלב בהזמנה, ורשימה פתוחה של שבעה שירותים מעל
           כפתור התשלום נקראת כמו מכשול/upsell אגרסיבי. המונה בכותרת
           מראה מה נבחר גם כשהאזור סגור. המחירים מגיעים מ-DVT_SERVICES
           ב-checkout.js (תצוגה) ונגבים לפי SERVICE_OPTIONS_ ב-
           4-payment-api.gs — ומקור האמת לשניהם הוא PRICE_LIST ב-
           CRM+SUPPLIERS/2-pricelist-picker.gs. -->
      <details class="svc-box" id="servicesBox" style="margin:18px 0 12px">
        <summary class="svc-summary">
          <span class="svc-title" id="servicesTitle"></span>
          <span class="svc-count" id="servicesCount"></span>
          <span class="svc-chev" aria-hidden="true">⌄</span>
        </summary>
        <p class="svc-hint" id="servicesHint"></p>
        <div id="servicesOptions" class="svc-opts"></div>
      </details>

      <div style="margin:18px 0 12px">
        <label class="field-label" style="margin-bottom:6px;display:block" id="installmentsLabel"></label>
        <select id="installmentsCount" onchange="renderCheckoutTotals()">
          <option value="1">1</option><option value="2">2</option><option value="3">3</option>
          <option value="4">4</option><option value="6">6</option><option value="8">8</option>
          <option value="10">10</option><option value="12">12</option>
        </select>
        <p style="font-size:11.5px;color:var(--ink-soft);margin:6px 0 0" id="installmentsHint"></p>
      </div>

      <ul class="summary-list" id="shipRow" style="display:none;margin-bottom:8px">
        <li><span class="k" id="shipLabel"></span><span class="v" id="shipValue">0 ₪</span></li>
      </ul>
      <ul class="summary-list" id="servicesRow" style="display:none;margin-bottom:8px">
        <li><span class="k" id="servicesRowLabel"></span><span class="v" id="servicesRowValue">0 ₪</span></li>
      </ul>
      <ul class="summary-list" id="feeRow" style="display:none;margin-bottom:8px">
        <li><span class="k" id="feeLabel"></span><span class="v" id="feeValue">0 ₪</span></li>
      </ul>
      <div class="checkout-total-row">
        <span id="grandTotalLabel"></span>
        <span id="grandTotalPrice">0 ₪</span>
      </div>
      <p id="monthlyBreakdownRow" style="display:none;font-size:12.5px;color:var(--ink-soft);margin:8px 0 0;text-align:center"></p>

      <div class="checkout-field">
        <label class="field-label" id="labelName"></label>
        <input id="custName" type="text" autocomplete="name">
      </div>
      <div class="checkout-field">
        <label class="field-label" id="labelPhone"></label>
        <input id="custPhone" type="tel" autocomplete="tel" dir="ltr">
      </div>
      <div class="checkout-field">
        <label class="field-label" id="labelEmail"></label>
        <input id="custEmail" type="email" autocomplete="email" dir="ltr">
      </div>

      <label style="display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;margin:4px 0 12px;cursor:pointer">
        <input type="checkbox" id="isBusinessCheckbox" onchange="toggleBusinessField()" style="width:16px;height:16px;cursor:pointer">
        <span id="isBusinessLabel"></span>
      </label>
      <div class="checkout-field" id="companyNameField" style="display:none">
        <label class="field-label" id="labelCompanyName"></label>
        <input id="custCompanyName" type="text">
        <p id="invoiceTypeHint" style="font-size:11.5px;color:var(--ink-soft);margin:6px 0 0"></p>
      </div>

      <label style="display:flex;align-items:flex-start;gap:8px;font-size:13.5px;color:var(--ink-soft);margin-top:16px;cursor:pointer">
        <input type="checkbox" id="termsAgreeCheckbox" style="margin-top:3px;flex-shrink:0;width:16px;height:16px;cursor:pointer">
        <span id="termsAgreeLabel"></span>
      </label>

      <div id="checkoutValidation" class="validation-msg" style="display:none"></div>
      <button class="btn btn-accent" id="checkoutSubmitBtn" onclick="submitCheckout()"></button>
    </div>
  </div>
</div>

<footer>
  <span class="footer-logo-crop"><img class="footer-logo" src="images/logo-dvirtech-transparent.png" alt="DvirTech"></span>
  <span id="footerText"></span>
  <div class="footer-legal">
    <a href="about.html" id="footerAboutLink"></a>
    <a href="contact.html" id="footerContactLink"></a>
    <a href="terms.html" id="footerTermsLink"></a>
  </div>
</footer>

<script src="sprite.js"></script>
<script src="i18n.js"></script>
<script src="search-core.js"></script>
<script src="site-header.js"></script>
<script src="checkout.js"></script>
</body>
</html>
