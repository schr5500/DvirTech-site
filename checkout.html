<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DvirTech — סיכום הזמנה</title>
<script>
  (function(){
    var saved = "he";
    try { saved = localStorage.getItem("dvirtech_lang") || "he"; } catch(e) {}
    document.documentElement.lang = saved;
    document.documentElement.dir = saved === "he" ? "rtl" : "ltr";
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="wrap headbar">
    <div class="brand"><img class="brand-logo" src="images/logo-dvirtech.png" alt="DvirTech"></div>
    <div class="lang-switch">
      <button class="lang-btn" data-lang="he" onclick="setLang('he')">עברית</button>
      <button class="lang-btn" data-lang="en" onclick="setLang('en')">English</button>
    </div>
  </div>
</header>

<div class="wrap" style="max-width:640px;padding-top:36px;padding-bottom:60px">
  <a href="javascript:history.back()" class="checkout-back-link" id="backLink"></a>

  <div class="panel" style="margin-top:14px">
    <h1 id="pageTitle" style="font-size:22px;margin:0 0 4px"></h1>
    <p class="sub" id="pageSubtitle" style="margin:0 0 20px"></p>

    <div id="emptyState" style="display:none;text-align:center;padding:30px 0">
      <p id="emptyStateText" style="color:var(--ink-soft);margin-bottom:16px"></p>
      <a href="catalog.html" class="btn btn-primary" id="emptyStateBtn" style="display:inline-flex;width:auto;padding:12px 22px"></a>
    </div>

    <div id="checkoutContent">
      <ul class="summary-list" id="checkoutSummary"></ul>
      <div class="checkout-total-row">
        <span id="checkoutTotalLabel"></span>
        <span id="checkoutTotalPrice">0 ₪</span>
      </div>

      <div class="checkout-field">
        <label class="field-label" id="labelName"></label>
        <input id="custName" type="text" autocomplete="name">
      </div>
      <div class="checkout-field">
        <label class="field-label" id="labelPhone"></label>
        <input id="custPhone" type="tel" autocomplete="tel" dir="ltr">
      </div>
      <div class="checkout-field">
        <label class="field-label" id="labelEmail"></label>
        <input id="custEmail" type="email" autocomplete="email" dir="ltr">
      </div>

      <label style="display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;margin:4px 0 12px;cursor:pointer">
        <input type="checkbox" id="isBusinessCheckbox" onchange="toggleBusinessField()" style="width:16px;height:16px;cursor:pointer">
        <span id="isBusinessLabel"></span>
      </label>
      <div class="checkout-field" id="companyNameField" style="display:none">
        <label class="field-label" id="labelCompanyName"></label>
        <input id="custCompanyName" type="text">
        <p id="invoiceTypeHint" style="font-size:11.5px;color:var(--ink-soft);margin:6px 0 0"></p>
      </div>

      <label style="display:flex;align-items:flex-start;gap:8px;font-size:13.5px;color:var(--ink-soft);margin-top:16px;cursor:pointer">
        <input type="checkbox" id="termsAgreeCheckbox" style="margin-top:3px;flex-shrink:0;width:16px;height:16px;cursor:pointer">
        <span id="termsAgreeLabel"></span>
      </label>

      <div id="checkoutValidation" class="validation-msg" style="display:none"></div>
      <button class="btn btn-accent" id="checkoutSubmitBtn" onclick="submitCheckout()"></button>
    </div>
  </div>
</div>

<footer>
  <img class="footer-logo" src="images/logo-dvirtech.png" alt="DvirTech">
  <span id="footerText"></span>
  <div class="footer-legal">
    <a href="about.html" id="footerAboutLink"></a>
    <a href="contact.html" id="footerContactLink"></a>
    <a href="terms.html" id="footerTermsLink"></a>
  </div>
</footer>

<script src="i18n.js"></script>
<script src="checkout.js"></script>
</body>
</html>
